<?xml version="1.0" encoding="UTF-8"?>
<!-- mviz icon: the sound field — a warm bass carpet along the bottom, a column
     of glows shrinking towards the treble, a few sparks on top and two faint
     glints beyond the speakers. Plain gradients only (no filters), so every
     SVG renderer, including Qt's, draws it the same. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b36"/>
      <stop offset="1" stop-color="#06070f"/>
    </linearGradient>
    <radialGradient id="carpet">
      <stop offset="0" stop-color="#ffe2b0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff9a6a" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#d9407e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9b2c7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-yellow">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ffd25e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-green">
      <stop offset="0" stop-color="#f2fff4" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#6dfb98" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2fd36c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-cyan">
      <stop offset="0" stop-color="#effcff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#5fdcff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-violet">
      <stop offset="0" stop-color="#f6f2ff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#9b86ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6a4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-magenta">
      <stop offset="0" stop-color="#fff0fb" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ff6fd2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e03ab0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#d8f4ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9fdcff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glint-cyan">
      <stop offset="0" stop-color="#7fe6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2aa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glint-magenta">
      <stop offset="0" stop-color="#ff8ad9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e03ab0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="53.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- bass carpet -->
  <ellipse cx="128" cy="200" rx="104" ry="28" fill="url(#carpet)"/>

  <!-- glows: lower = larger and softer -->
  <ellipse cx="116" cy="158" rx="40" ry="30" fill="url(#g-yellow)"/>
  <circle cx="144" cy="124" r="26" fill="url(#g-green)"/>
  <circle cx="118" cy="96" r="20" fill="url(#g-cyan)"/>
  <circle cx="140" cy="73" r="15" fill="url(#g-violet)"/>
  <circle cx="122" cy="56" r="11" fill="url(#g-magenta)"/>

  <!-- treble sparks -->
  <circle cx="108" cy="40" r="6" fill="url(#spark)"/>
  <circle cx="134" cy="36" r="5" fill="url(#spark)"/>
  <circle cx="150" cy="46" r="4.5" fill="url(#spark)"/>

  <!-- beyond the speakers -->
  <ellipse cx="50" cy="112" rx="14" ry="10" fill="url(#glint-cyan)"/>
  <ellipse cx="208" cy="96" rx="12" ry="9" fill="url(#glint-magenta)"/>
</svg>
