[package]
name = "mviz"
version = "0.1.0"
edition = "2024"
description = "A looping music player that shows the stereo sound field: every frequency as light, where you hear it"
license = "MIT"
repository = "https://github.com/Wappen/mviz"
readme = "README.md"
keywords = ["music", "visualizer", "audio", "stereo", "player"]
categories = ["multimedia::audio", "visualization"]

[dependencies]
async-channel = "2"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
glyphon = "0.12"
macroquad = "0.4"
mpris-server = "0.11"
pollster = "1.0.2"
raw-window-handle = "0.6"
rfd = "0.18.0"
rustfft = "6.4.1"
symphonia = { version = "0.6.1", features = ["all"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wgpu = "30"
winit = "0.30"

# Analysis runs over the whole song at load; keep dependencies fast even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"
